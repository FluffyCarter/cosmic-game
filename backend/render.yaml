services:
  - type: web
    name: cosmic-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: game.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true